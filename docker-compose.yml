# Project name for containers, images, network and volume (otherwise taken from the folder name)
name: healthscanner

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: healthscan
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    # No published port: only the backend reaches it, over the Compose network
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d healthscan"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ai-service:
    build: ./ai-service
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - AI_SHARED_SECRET=${AI_SHARED_SECRET:?Set AI_SHARED_SECRET in .env}
      # MOCK_AI=1 answers with canned data instead of calling Groq (demos and E2E tests)
      - MOCK_AI=${MOCK_AI:-}
    # No published port: only the backend reaches it, and it must send AI_SHARED_SECRET
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      # In production behind HTTPS, set BACKEND_BIND=127.0.0.1 so only the proxy is reachable from outside
      - "${BACKEND_BIND:-0.0.0.0}:${BACKEND_PORT:-8080}:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/healthscan
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - AI_SERVICE_URL=http://ai-service:8000
      - AI_SHARED_SECRET=${AI_SHARED_SECRET:?Set AI_SHARED_SECRET in .env}
      - USDA_API_KEY=${USDA_API_KEY:-DEMO_KEY}
      - API_KEY=${API_KEY:-}
      # Only for the web version of the app, e.g. http://localhost:8081
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      # "native" behind the HTTPS proxy: the client IP comes from X-Forwarded-For, set by the proxy
      - SERVER_FORWARD_HEADERS_STRATEGY=${FORWARD_HEADERS_STRATEGY:-none}
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # HTTPS reverse proxy; only started with: docker compose --profile https up -d
  proxy:
    image: caddy:2.11.4
    profiles: [https]
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and keys, kept across restarts
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:

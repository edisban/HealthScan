# Project name for containers, images, network and volume (otherwise taken from the folder name)
name: healthscanner

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: healthscan
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    # No published port: only the backend reaches it, over the Compose network
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d healthscan"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ai-service:
    build: ./ai-service
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - AI_SHARED_SECRET=${AI_SHARED_SECRET:?Set AI_SHARED_SECRET in .env}
    # No published port: only the backend reaches it, and it must send AI_SHARED_SECRET
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/healthscan
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - AI_SERVICE_URL=http://ai-service:8000
      - AI_SHARED_SECRET=${AI_SHARED_SECRET:?Set AI_SHARED_SECRET in .env}
      - USDA_API_KEY=${USDA_API_KEY:-DEMO_KEY}
      - API_KEY=${API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

volumes:
  pgdata:

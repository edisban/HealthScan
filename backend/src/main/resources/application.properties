server.port=8080
spring.datasource.url=jdbc:postgresql://localhost:5432/healthscan
spring.datasource.username=postgres
spring.datasource.password=postgres
# Flyway owns the schema (db/migration); Hibernate only checks that the entities match it
spring.jpa.hibernate.ddl-auto=validate
# Databases created before Flyway are baselined at version 0, so V1 still runs and adds what is missing
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.show-sql=true
# No database session held open through slow AI calls
spring.jpa.open-in-view=false
# Framework errors (404, 405, 415, ...) also use RFC 9457 problem JSON
spring.mvc.problemdetails.enabled=true

# Image uploads (base64 JSON bodies and multipart files)
healthscan.max-image-size=8MB
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB
# Read (and discard) a rejected body up to 16 MB, so an oversized upload gets a clean 413 instead of
# a connection reset mid-upload, which some proxies (and Docker Desktop's port forwarding) handle badly
server.tomcat.max-swallow-size=16MB

# Requests per minute per client IP; "strict" covers the endpoints that call Groq
healthscan.rate-limit.strict-per-minute=10
healthscan.rate-limit.relaxed-per-minute=60

# Optional X-Api-Key check for /api/**; empty disables it
healthscan.api-key=${API_KEY:}

# AI service location and the shared secret sent in X-Internal-Secret
healthscan.ai-service-url=${AI_SERVICE_URL:http://localhost:8000}
healthscan.ai-shared-secret=${AI_SHARED_SECRET:}

# Comma-separated origins of the web app, e.g. http://localhost:8081; empty turns CORS off
healthscan.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Only the health endpoint is exposed (used by the docker-compose healthcheck)
management.endpoints.web.exposure.include=health

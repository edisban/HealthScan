name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      # Unit tests, Testcontainers integration tests, and the 80% line-coverage gate (JaCoCo)
      - run: mvn -B verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/target/site/jacoco/

  ai-service:
    name: AI service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-service/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest

  mobile:
    name: Mobile tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: End-to-end tests (Playwright)
    needs: [backend, ai-service, mobile]
    runs-on: ubuntu-latest
    env:
      # The whole stack with canned AI answers: no Groq key, deterministic results
      MOCK_AI: "1"
      POSTGRES_PASSWORD: e2e-password
      AI_SHARED_SECRET: e2e-secret
      API_KEY: e2e-key
      CORS_ALLOWED_ORIGINS: http://localhost:8081
      API_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            mobile/package-lock.json
            e2e/package-lock.json
      - name: Start the stack
        run: docker compose up -d --build --wait
      - name: Build the web app
        working-directory: mobile
        run: |
          npm ci
          EXPO_PUBLIC_API_BASE=$API_URL EXPO_PUBLIC_API_KEY=$API_KEY npm run build:web
      - name: Run Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Container logs
        if: failure()
        run: docker compose logs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/

  secrets:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  images:
    name: Build, scan and publish ${{ matrix.service }} image
    needs: [e2e, secrets]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, ai-service]
    env:
      # Every run proves the image builds and scans it; only the default branch publishes it
      PUBLISH: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/healthscan-${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          load: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      # Reports known vulnerabilities that have a fix. It does not fail the build: some fixes need
      # Spring Boot 4, a planned migration. Dependabot opens the upgrade pull requests.
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish
        if: env.PUBLISH == 'true'
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

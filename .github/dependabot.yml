# Weekly dependency updates. Minor and patch updates are grouped into one pull request per
# ecosystem, so the noise stays low; major updates come one by one.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule: { interval: weekly }
    groups:
      minor-and-patch: { update-types: [minor, patch] }

  - package-ecosystem: pip
    directory: /ai-service
    schedule: { interval: weekly }
    groups:
      minor-and-patch: { update-types: [minor, patch] }

  - package-ecosystem: npm
    directory: /mobile
    schedule: { interval: weekly }
    groups:
      minor-and-patch: { update-types: [minor, patch] }

  - package-ecosystem: npm
    directory: /e2e
    schedule: { interval: weekly }

  - package-ecosystem: docker
    directories: [/backend, /ai-service, /nginx]
    schedule: { interval: weekly }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
